<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>My Account – White Knight</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicons -->
  <link href="../assets/img/WK4.png" rel="icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --bg: #07091a;
      --surface: #0d1226;
      --surface2: #111830;
      --border: rgba(255,255,255,.09);
      --border-hover: rgba(139,92,246,.4);
      --accent: #8b5cf6;
      --accent-grad: linear-gradient(90deg,#7c3aed,#8b5cf6,#9333ea);
      --text: #e5e7eb;
      --text-muted: rgba(255,255,255,.4);
      --error: #fca5a5;
      --success: #86efac;
      --danger: rgba(239,68,68,.12);
      --danger-border: rgba(239,68,68,.3);
      --danger-text: #fca5a5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── top bar ── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 17px;
    }

    .topbar-brand img { height: 30px; width: 30px; object-fit: contain; }

    .topbar-back {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color .2s;
    }

    .topbar-back:hover { color: var(--accent); }

    /* ── layout ── */
    .page {
      max-width: 780px;
      margin: 0 auto;
      padding: 36px 20px 60px;
    }

    /* ── profile hero ── */
    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--accent-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      letter-spacing: .5px;
      font-family: 'Montserrat', sans-serif;
    }

    .profile-info { overflow: hidden; }

    .profile-email {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-joined {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .profile-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      background: rgba(139,92,246,.18);
      border: 1px solid rgba(139,92,246,.35);
      color: #c4b5fd;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .7px;
      border-radius: 999px;
      padding: 3px 10px;
    }

    /* ── section heading ── */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin: 24px 0 10px;
    }

    /* ── cards / rows ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .card-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      cursor: pointer;
      transition: background .18s, border-color .18s;
      border-bottom: 1px solid var(--border);
    }

    .card-row:last-child { border-bottom: none; }

    .card-row:hover { background: var(--surface2); }

    .row-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(139,92,246,.14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      color: #a78bfa;
    }

    .row-text { flex: 1; min-width: 0; }
    .row-label { font-size: 14px; font-weight: 600; color: var(--text); }
    .row-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .row-arrow {
      color: var(--text-muted);
      font-size: 18px;
      transition: transform .2s, color .2s;
    }

    .card-row[aria-expanded="true"] .row-arrow { transform: rotate(90deg); color: var(--accent); }

    .status-pill {
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      padding: 3px 10px;
      background: rgba(134,239,172,.1);
      border: 1px solid rgba(134,239,172,.3);
      color: var(--success);
    }

    /* ── change-password form ── */
    .pw-form {
      padding: 0 18px 16px;
      display: none;
      flex-direction: column;
      gap: 0;
      border-top: 1px solid var(--border);
    }

    .pw-form.open { display: flex; }

    .pw-field {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 13px;
      outline: none;
      margin-top: 10px;
      font-family: inherit;
      transition: border-color .2s, box-shadow .2s;
    }

    .pw-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139,92,246,.2);
    }

    .pw-save {
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      background: var(--accent-grad);
      font-family: inherit;
      transition: opacity .2s;
    }

    .pw-save:hover { opacity: .88; }

    .pw-msg {
      min-height: 18px;
      margin-top: 8px;
      font-size: 12px;
    }

    .pw-msg.error { color: var(--error); }
    .pw-msg.ok    { color: var(--success); }

    /* ── sign-out button ── */
    .signout-btn {
      width: 100%;
      margin-top: 28px;
      padding: 13px;
      border: 1px solid var(--danger-border);
      background: var(--danger);
      color: var(--danger-text);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s;
    }

    .signout-btn:hover { background: rgba(239,68,68,.22); }

    /* ── not-logged-in gate ── */
    .gate {
      text-align: center;
      padding: 80px 20px;
      display: none;
    }

    .gate i { font-size: 48px; color: var(--accent); margin-bottom: 18px; display: block; }
    .gate h2 { font-family: 'Montserrat', sans-serif; font-size: 22px; margin-bottom: 10px; }
    .gate p  { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

    .gate-btn {
      display: inline-block;
      padding: 12px 30px;
      background: var(--accent-grad);
      color: #fff;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: opacity .2s;
    }

    .gate-btn:hover { opacity: .85; color: #fff; }

    /* ── responsive ── */
    @media (max-width: 520px) {
      .profile-card { flex-direction: column; align-items: flex-start; }
      .topbar { padding: 12px 16px; }
      .page { padding: 24px 14px 50px; }
    }
  </style>
</head>

<body>

  <!-- Top bar -->
  <div class="topbar">
    <a href="../index.html" class="topbar-brand">
      <img src="../assets/img/WK4.png" alt="White Knight logo">
      White Knight
    </a>
    <a href="../index.html" class="topbar-back">
      <i class="bi bi-arrow-left"></i> Back to site
    </a>
  </div>

  <main class="page">

    <!-- Not-logged-in gate -->
    <div class="gate" id="wk-gate">
      <i class="bi bi-person-lock"></i>
      <h2>You're not signed in</h2>
      <p>Please log in to view your account dashboard.</p>
      <a href="../index.html" class="gate-btn wk-open-auth">Go to Login</a>
    </div>

    <!-- Logged-in dashboard -->
    <div id="wk-dashboard" style="display:none;">

      <!-- Profile card -->
      <div class="profile-card">
        <div class="avatar" id="wk-avatar"></div>
        <div class="profile-info">
          <div class="profile-email" id="wk-email"></div>
          <div class="profile-joined" id="wk-joined"></div>
          <div class="profile-badge"><i class="bi bi-star-fill"></i> Member</div>
        </div>
      </div>

      <!-- Account section -->
      <div class="section-label">Account</div>
      <div class="card">

        <!-- Change password row -->
        <div class="card-row" id="wk-pw-toggle" role="button" tabindex="0" aria-expanded="false">
          <div class="row-icon"><i class="bi bi-key"></i></div>
          <div class="row-text">
            <div class="row-label">Change Password</div>
            <div class="row-sub">Update your login credentials</div>
          </div>
          <i class="bi bi-chevron-right row-arrow"></i>
        </div>

        <!-- Change password form -->
        <div class="pw-form" id="wk-pw-form">
          <input class="pw-field" id="wk-pw-current"  type="password" placeholder="Current password"          autocomplete="current-password">
          <input class="pw-field" id="wk-pw-new"      type="password" placeholder="New password (min 6 chars)" autocomplete="new-password">
          <input class="pw-field" id="wk-pw-confirm"  type="password" placeholder="Confirm new password"      autocomplete="new-password">
          <button class="pw-save" id="wk-pw-save">Save New Password</button>
          <div class="pw-msg" id="wk-pw-msg"></div>
        </div>

      </div>

      <!-- Downloads section -->
      <div class="section-label">Downloads</div>
      <div class="card">
        <div class="card-row" style="cursor:default;">
          <div class="row-icon"><i class="bi bi-download"></i></div>
          <div class="row-text">
            <div class="row-label">Protected Downloads</div>
            <div class="row-sub">All gated content is unlocked for your account</div>
          </div>
          <span class="status-pill">Active</span>
        </div>
      </div>

      <!-- Sign out -->
      <button class="signout-btn" id="wk-signout">
        <i class="bi bi-box-arrow-right"></i> Sign Out
      </button>

    </div><!-- /dashboard -->

  </main>

  <script>
    (function () {
      var USERS_KEY   = "wk_users_v1";
      var SESSION_KEY = "wk_current_user_v1";

      function readUsers() {
        try { return JSON.parse(localStorage.getItem(USERS_KEY) || "[]"); }
        catch (e) { return []; }
      }

      function writeUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
      function getUser()     { return localStorage.getItem(SESSION_KEY) || ""; }
      function clearUser()   { localStorage.removeItem(SESSION_KEY); }

      function getInitials(email) {
        var local = email.indexOf("@") !== -1 ? email.split("@")[0] : email;
        var parts = local.replace(/[^a-zA-Z0-9]/g, " ").trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return "?";
        if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        return parts[0].slice(0, 2).toUpperCase();
      }

      function formatDate(ts) {
        if (!ts) return "Unknown";
        return new Date(ts).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
      }

      var email = getUser();

      if (!email) {
        document.getElementById("wk-gate").style.display = "block";
        return;
      }

      /* ── populate profile ── */
      document.getElementById("wk-dashboard").style.display = "block";
      document.getElementById("wk-avatar").textContent = getInitials(email);
      document.getElementById("wk-email").textContent  = email;

      var users = readUsers();
      var user  = users.find(function (u) { return u.email === email; });
      document.getElementById("wk-joined").textContent =
        "Member since " + formatDate(user ? user.createdAt : null);

      /* ── change-password toggle ── */
      var pwToggle  = document.getElementById("wk-pw-toggle");
      var pwForm    = document.getElementById("wk-pw-form");
      var pwCurrent = document.getElementById("wk-pw-current");
      var pwNew     = document.getElementById("wk-pw-new");
      var pwConfirm = document.getElementById("wk-pw-confirm");
      var pwSave    = document.getElementById("wk-pw-save");
      var pwMsg     = document.getElementById("wk-pw-msg");

      function setPwMsg(text, isError) {
        pwMsg.textContent = text || "";
        pwMsg.className   = "pw-msg " + (text ? (isError ? "error" : "ok") : "");
      }

      function togglePwForm() {
        var open = pwForm.classList.toggle("open");
        pwToggle.setAttribute("aria-expanded", open ? "true" : "false");
        if (open) { pwCurrent.focus(); }
        else { pwCurrent.value = ""; pwNew.value = ""; pwConfirm.value = ""; setPwMsg("", false); }
      }

      pwToggle.addEventListener("click", togglePwForm);
      pwToggle.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); togglePwForm(); }
      });

      pwSave.addEventListener("click", function () {
        var oldPw  = pwCurrent.value;
        var newPw  = pwNew.value;
        var confPw = pwConfirm.value;
        var list   = readUsers();
        var u      = list.find(function (x) { return x.email === email; });

        // NOTE: btoa encoding is used here to avoid storing plain text.
        // This is a client-side demo auth system; for production use,
        // replace with server-side authentication and proper password hashing.
        if (!u || u.password !== btoa(oldPw)) { setPwMsg("Current password is incorrect.", true);  return; }
        if (newPw.length < 6)                { setPwMsg("New password must be at least 6 characters.", true); return; }
        if (newPw !== confPw)                { setPwMsg("Passwords do not match.", true); return; }

        u.password = btoa(newPw);
        writeUsers(list);
        setPwMsg("Password updated successfully.", false);
        pwCurrent.value = ""; pwNew.value = ""; pwConfirm.value = "";
        setTimeout(function () { togglePwForm(); }, 1600);
      });

      /* ── sign out ── */
      document.getElementById("wk-signout").addEventListener("click", function () {
        clearUser();
        window.location.href = "../index.html";
      });

    })();
  </script>

</body>
</html>
